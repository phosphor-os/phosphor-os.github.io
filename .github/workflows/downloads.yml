# Once a day: the release download counts into data/downloads.json, for the chart on stats.html.
name: Download counts
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take today's counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          [ -f data/downloads.json ] || echo '[]' > data/downloads.json
          gh api --paginate repos/f3bandit/phosphor_os/releases \
            --jq '[.[] | .tag_name as $t | .assets[] | {key: ($t + "/" + .name), value: .download_count}] | from_entries' > today.json
          jq --arg d "$(date -u +%F)" --slurpfile c today.json \
            '[.[] | select(.date != $d)] + [{date: $d, counts: $c[0]}]' data/downloads.json > new.json
          mv new.json data/downloads.json
          rm today.json
      - name: Save it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/downloads.json
          git diff --cached --quiet || git commit -m "Download counts for $(date -u +%F)"
          git push
